name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'solar_app/**'
      - '.github/workflows/build-flutter-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate standard Android project & configure signing
        working-directory: solar_app
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=solar_app --org=com.sunward
          python3 scripts/setup_android.py

      - name: Install Flutter dependencies
        working-directory: solar_app
        run: flutter pub get

      - name: Build Signed Release APK
        working-directory: solar_app
        run: flutter build apk --release

      - name: Publish APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.4"
          APK_PATH="solar_app/build/app/outputs/flutter-apk/app-release.apk"
          OUT_APK="sunward-solar-flutter-${TAG_NAME}.apk"
          cp "$APK_PATH" "$OUT_APK"
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$OUT_APK" --clobber
          else
            gh release create "$TAG_NAME" "$OUT_APK" --title "$TAG_NAME - Sunward Solar App Update" --notes "Release $TAG_NAME with Update Checker Fix, Bank Loan & EMI Box, Custom Property Type Dropdown, and Direct WhatsApp Chat Deep Linking"
          fi

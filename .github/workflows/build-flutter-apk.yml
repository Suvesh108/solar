name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'solar_app/**'
      - '.github/workflows/build-flutter-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate standard Android project & configure signing
        working-directory: solar_app
        run: |
          rm -rf android test
          flutter create . --platforms=android --project-name=solar_app --org=com.sunward
          rm -rf test
          python3 scripts/setup_android.py

      - name: Install Flutter dependencies
        working-directory: solar_app
        run: flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd solar_app
          flutter analyze > ../analyze_log.txt 2>&1 || true
          cd ..
          if grep -E "• error •" analyze_log.txt > /dev/null 2>&1; then
            echo "=== FLUTTER ANALYZE FOUND ERRORS ==="
            cat analyze_log.txt
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -B debug-log
            git add analyze_log.txt
            git commit -m "debug: analyze log" || true
            git push -f origin debug-log || true
            cd solar_app
            flutter analyze
          fi

      - name: Build Signed Release APK
        working-directory: solar_app
        run: |
          if ! flutter build apk --release -v > ../build_log.txt 2>&1; then
            echo "=== FLUTTER BUILD RELEASE FAILED ==="
            tail -n 150 ../build_log.txt
            cd ..
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -B debug-log
            git add build_log.txt
            git commit -m "debug: build log" || true
            git push -f origin debug-log || true
            exit 1
          fi

      - name: Publish APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.9"
          APK_PATH="solar_app/build/app/outputs/flutter-apk/app-release.apk"
          OUT_APK="Sunward.apk"
          cp "$APK_PATH" "$OUT_APK"
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Deleting existing release $TAG_NAME to ensure clean single-APK release..."
            gh release delete "$TAG_NAME" -y || true
          fi
          gh release create "$TAG_NAME" "$OUT_APK" \
            --title "$TAG_NAME - Sunward Solar App Update" \
            --notes "### Sunward Solar $TAG_NAME Updates

- **Unified Solar Setup & Pricing**: Capacity-based turnkey pricing (Residential @ ₹70,000/kW, Commercial @ ₹50,000/kW).
- **On-Grid vs Hybrid Selection**: Dynamic battery bank integration with manual pricing and voltage options (24V / 48V).
- **Clean Responsive Layout**: Fixed button truncation and refined typography (14–18px bold) for effortless readability.
- **Pure English Interface**: Simple, professional English throughout.
- **Custom Sunward Dropdown System**: Smooth custom animated selection cards for Property Type and all selectors.
- **Rebuilt In-App Updater**: Direct GitHub releases integration with seamless in-app download and package installation."

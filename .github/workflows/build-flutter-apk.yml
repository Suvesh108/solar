name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'solar_app/**'
      - '.github/workflows/build-flutter-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate standard Android project & configure signing
        working-directory: solar_app
        run: |
          rm -rf android test
          flutter create . --platforms=android --project-name=solar_app --org=com.sunward
          rm -rf test
          python3 scripts/setup_android.py

      - name: Install Flutter dependencies
        working-directory: solar_app
        run: flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd solar_app
          flutter analyze > ../analyze_log.txt 2>&1 || true
          cd ..
          if grep -E "• error •" analyze_log.txt > /dev/null 2>&1; then
            echo "=== FLUTTER ANALYZE FOUND ERRORS ==="
            cat analyze_log.txt
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -B debug-log
            git add analyze_log.txt
            git commit -m "debug: analyze log" || true
            git push -f origin debug-log || true
            cd solar_app
            flutter analyze
          fi

      - name: Build Signed Release APK
        working-directory: solar_app
        run: |
          if ! flutter build apk --release -v > ../build_log.txt 2>&1; then
            echo "=== FLUTTER BUILD RELEASE FAILED ==="
            tail -n 150 ../build_log.txt
            cd ..
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -B debug-log
            git add build_log.txt
            git commit -m "debug: build log" || true
            git push -f origin debug-log || true
            exit 1
          fi

      - name: Publish APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.7"
          APK_PATH="solar_app/build/app/outputs/flutter-apk/app-release.apk"
          OUT_APK1="Sunward-${TAG_NAME}.apk"
          OUT_APK2="Sunward.apk"
          OUT_APK3="sunward-solar-flutter-${TAG_NAME}.apk"
          cp "$APK_PATH" "$OUT_APK1"
          cp "$APK_PATH" "$OUT_APK2"
          cp "$APK_PATH" "$OUT_APK3"
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$OUT_APK1" "$OUT_APK2" "$OUT_APK3" --clobber
          else
            gh release create "$TAG_NAME" "$OUT_APK1" "$OUT_APK2" "$OUT_APK3" --title "$TAG_NAME - Sunward Solar App Update" --notes "Release $TAG_NAME: Direct WhatsApp chatbox dispatch with card attachment, smart 0-clearing responsive inputs, in-app internal APK download & install without external browser, and robust file provider integration."
          fi

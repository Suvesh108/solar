name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'solar_app/**'
      - '.github/workflows/build-flutter-apk.yml'
      - 'release_notes.md'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate standard Android project & configure signing
        working-directory: solar_app
        run: |
          rm -rf android test
          flutter create . --platforms=android --project-name=solar_app --org=com.sunward
          rm -rf test
          python3 scripts/setup_android.py

      - name: Install Flutter dependencies
        working-directory: solar_app
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: solar_app
        run: |
          flutter analyze > analyze_log.txt 2>&1 || true
          if grep -E "• error •" analyze_log.txt > /dev/null 2>&1; then
            echo "=== FLUTTER ANALYZE FOUND ERRORS ==="
            cat analyze_log.txt
            exit 1
          fi

      - name: Build Signed Release APK
        working-directory: solar_app
        run: |
          TAG_VER="${{ github.ref_name }}"
          if [ -z "$TAG_VER" ] || [ "$TAG_VER" = "main" ]; then
            TAG_VER="v0.1.6"
          fi
          CLEAN_VER="${TAG_VER#v}"
          BUILD_NUM="${{ github.run_number }}"
          echo "Building release APK for version: ${CLEAN_VER} with build number: ${BUILD_NUM}"

          MAX_RETRIES=3
          RETRY=1
          BUILD_SUCCESS=0
          while [ $RETRY -le $MAX_RETRIES ]; do
            echo "=== BUILD ATTEMPT $RETRY of $MAX_RETRIES ==="
            if flutter build apk --release --no-tree-shake-icons --build-name="${CLEAN_VER}" --build-number="${BUILD_NUM}" -v > build_log.txt 2>&1; then
              BUILD_SUCCESS=1
              echo "=== BUILD SUCCEEDED ON ATTEMPT $RETRY ==="
              break
            else
              echo "=== BUILD ATTEMPT $RETRY FAILED ==="
              tail -n 80 build_log.txt
              if [ $RETRY -lt $MAX_RETRIES ]; then
                echo "Waiting 15 seconds before retrying build..."
                sleep 15
              fi
              RETRY=$((RETRY + 1))
            fi
          done

          if [ $BUILD_SUCCESS -ne 1 ]; then
            echo "=== ALL $MAX_RETRIES BUILD ATTEMPTS FAILED ==="
            tail -n 150 build_log.txt
            exit 1
          fi

      - name: Publish APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_VER="${{ github.ref_name }}"
          if [ -z "$TAG_VER" ] || [ "$TAG_VER" = "main" ]; then
            TAG_VER="v0.1.6"
          fi
          APK_PATH="solar_app/build/app/outputs/flutter-apk/app-release.apk"
          OUT_APK="Sunward-Solar-${TAG_VER}.apk"
          cp "$APK_PATH" "$OUT_APK"

          if gh release view "$TAG_VER" > /dev/null 2>&1; then
            echo "Existing release $TAG_VER found. Cleaning any old APK assets to ensure ONLY ONE APK exists..."
            EXISTING_ASSETS=$(gh release view "$TAG_VER" --json assets -q '.assets[].name' 2>/dev/null || true)
            for asset in $EXISTING_ASSETS; do
              if [[ "$asset" == *.apk ]]; then
                echo "Removing older release asset: $asset"
                gh release delete-asset "$TAG_VER" "$asset" -y || true
              fi
            done
            echo "Uploading single release asset $OUT_APK..."
            gh release upload "$TAG_VER" "$OUT_APK" --clobber
          else
            echo "Creating new release $TAG_VER with single asset $OUT_APK..."
            gh release create "$TAG_VER" "$OUT_APK" --title "$TAG_VER - Sunward Solar App Update" --notes-file release_notes.md
          fi

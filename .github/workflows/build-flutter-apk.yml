name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'solar_app/**'
      - '.github/workflows/build-flutter-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate standard Android project files
        working-directory: solar_app
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=solar_app --org=com.sunward
          python3 - << 'EOF'
          import os

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.DIAL"/>
                      <data android:scheme="tel"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW"/>
                      <data android:scheme="https"/>
                  </intent>
              </queries>
          """

          if "<queries>" not in content:
              content = content.replace("<application", permissions + "\n    <application")
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)
          EOF

      - name: Install Flutter dependencies
        working-directory: solar_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: solar_app
        run: flutter build apk --release

      - name: Upload APK to Release v0.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp solar_app/build/app/outputs/flutter-apk/app-release.apk sunward-solar-flutter-v0.0.1.apk
          gh release upload v0.0.1 sunward-solar-flutter-v0.0.1.apk --clobber
